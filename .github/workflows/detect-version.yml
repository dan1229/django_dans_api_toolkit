name: Detect Version
# dan-release-standard: 3
#
# Installed by the `dan:release-setup` skill. The stamp comment above is the
# version of THIS template — release-setup greps for it to tell a conformed repo
# from a legacy one, and to know whether an upgrade is available. Don't remove it.
#
# THE TRIGGER IS A BRACKETED VERSION IN THE COMMIT SUBJECT. An ordinary commit
# must never contain `[X.X.X]` — that string IS the release. `dan:release`
# produces the one commit that should have it, and its subject is the whole
# message:
#
#     release: [2.4.0]
#
# THE NOTES COME FROM CHANGELOG.md, NOT FROM THE COMMIT MESSAGE. They used to be
# the commit body, which had two failure modes:
#
#   1. Any repo that dispatched a second workflow shipped an EMPTY release body,
#      because `github.event.head_commit` does not exist on `workflow_dispatch`.
#      django_bootstrapper 6.5.0 and personal-voice-engine 0.4.0 both shipped blank.
#   2. The repos that read the body directly flattened it with
#      `sed 's/^[[:space:]]*//'`, destroying every sub-bullet.
#
# Reading the CHANGELOG at the release SHA has neither failure mode: the section
# is committed in the same commit that triggers this workflow, so it is always
# present and always correctly indented. An empty extraction is a HARD ERROR
# here — never a silent generic body. A generic body is what hid failure #1 for
# months.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.X.X) — replay a release, or dry-run'
        required: false
        type: string

permissions:
  contents: write # tag, marker branch, release
  # actions: write  # UNCOMMENT together with the downstream-dispatch block at the
  #                 # bottom. Declaring `permissions:` at all NARROWS the token:
  #                 # the repos that dispatch a deploy today work only because
  #                 # they declare no block and inherit read-write. Adding the
  #                 # dispatch without this line fails with a 403.

env:
  # Bare `X.X.X` is the house default. Set to 'v' ONLY in repos whose existing
  # tags are already v-prefixed — a repo cannot switch, it would double-tag every
  # past version. (onyx-bot and ai-coding-army are the v-prefixed ones.)
  TAG_PREFIX: ''

jobs:
  detect-version:
    # `CI_RUNNER` is a repo VARIABLE, not a secret: unset means GitHub-hosted, and
    # `self-hosted` moves the job onto Daniel's runner. Written this way in the
    # template so a repo with no runner is unaffected and a repo with one is not
    # silently dragged back onto billed minutes by the next upgrade run.
    # `gh variable set CI_RUNNER --body self-hosted` opts in, `gh variable delete
    # CI_RUNNER` reverts. Nothing in this file needs sudo: `git push` uses the
    # credential actions/checkout writes, and the release action is a JS action.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from commit subject
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # %s (subject), NOT %B (subject + body). The trigger is documented as
          # subject-only, and with %B any ordinary commit whose BODY happens to
          # quote a bracketed version — a changelog line, a pasted error, a
          # trailer — fires a real release: tag, branch and release object, all
          # irreversible from CI.
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ $COMMIT_MSG =~ \[([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)\] ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No [X.X.X] in the commit message — not a release, nothing to do"
          fi

  release:
    needs: detect-version
    if: needs.detect-version.outputs.version != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the release SHA. On workflow_dispatch the default ref is the
          # branch head, which may have moved past the release commit — and the
          # CHANGELOG section must be read at the commit being released.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          # Matching notes, line by line:
          #
          #   `h` is the line with its leading hashes stripped, so matching is
          #   heading-LEVEL agnostic — legacy entries are `## [x]`, modern ones
          #   `### [x]`. The `$0 ~ /^#/` guard stops a bullet that merely starts
          #   with `[...]` being mistaken for a heading.
          #
          #   The closing bracket in `tag` is what makes dot-escaping unnecessary:
          #   extracting 4.8.3 does not match `### [4.8.3.4]`, because that line
          #   has `.` where `]` would be. (get_twenty has both, adjacent.)
          #
          #   Terminating on the next BRACKETED heading at any level means
          #   `#### Features` / `#### Fixes` subheadings inside an entry survive.
          #
          #   Terminating on a `-----` rule is what stops the copyright footer
          #   bleeding into the LAST entry in the file — i.e. the first release of
          #   a new repo. A bullet is `- text`; it is never 3+ bare dashes.
          #   Written `---+` and NOT `-{3,}`: /usr/bin/awk on the runners is
          #   mawk, which takes `{n}` but silently never matches an open-ended
          #   `{n,}`, which left this terminator dead and let the footer through.
          #
          #   `print` is bare on purpose. Never strip leading whitespace: the
          #   4-space sub-bullets are the shape, and flattening them is the second
          #   bug this file exists to fix.
          #
          #   `END { exit !f }` separates "no such section" from "section is
          #   empty" — two different mistakes with two different fixes.
          #
          # Redirect to a file and check the status; do NOT pipe awk into sed.
          # A pipeline returns sed's status, which would swallow the error below.
          if ! awk -v tag="[$VERSION]" '
                { h = $0; sub(/^#+[ \t]+/, "", h) }
                index(h, tag) == 1 && $0 ~ /^#/      { f = 1; next }
                f && $0 ~ /^#/ && index(h, "[") == 1 { exit }
                f && /^---+[[:space:]]*$/            { exit }
                f                                    { print }
                END                                  { exit !f }
              ' CHANGELOG.md > "$RUNNER_TEMP/raw.md"; then
            echo "::error::CHANGELOG.md has no [$VERSION] section at this commit."
            echo "::error::dan:release moves the section from TODO.md to CHANGELOG.md in the SAME commit — check that it landed."
            exit 1
          fi

          # Trim leading blank lines only; trailing ones are harmless in markdown.
          sed '/./,$!d' "$RUNNER_TEMP/raw.md" > "$RUNNER_TEMP/notes.md"

          # `test -s` is not enough — a file of blank lines is non-empty to it.
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::The [$VERSION] section in CHANGELOG.md is empty. Refusing to ship a blank release body."
            exit 1
          fi

          echo "notes_file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          {
            echo "### Release notes for $VERSION"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # OPTIONAL — version-source verification. Uncomment the block and pick ONE
      # FILE_VERSION line. Fails the release when the repo's version file
      # disagrees with the version being released.
      #
      # Turn this on wherever a version file exists: personal-voice-engine shipped
      # 0.4.0 with pyproject.toml still reading 0.3.0 and nothing noticed.
      #
      # It runs BEFORE the tag on purpose, so a mismatch leaves nothing behind to
      # clean up.
      # -----------------------------------------------------------------------
      - name: Verify version source
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          # setup.cfg — the django_dans_* packages keep it here, NOT in pyproject
          FILE_VERSION=$(awk -F' *= *' '/^version *=/{print $2; exit}' setup.cfg)
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::releasing $VERSION but the version file says $FILE_VERSION — bump it and re-cut"
            exit 1
          fi
          echo "version source agrees: $FILE_VERSION"

      # PyPI publish, inline rather than a dispatched second workflow. It runs
      # after the version check and BEFORE the tag, so a failed upload leaves no
      # tag, branch or release behind. PyPI never accepts the same version twice,
      # so a replay of a published version fails here too.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
          twine upload dist/*

      - name: Tag
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          TAG="${TAG_PREFIX}${VERSION}"
          # Ask the REMOTE, not the local clone — whether a local tag exists
          # depends on checkout's fetch config, but the remote is authoritative.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists — refusing to move it. Cut a new version instead."
            exit 1
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$TAG" -m "Release version $VERSION"
          git push origin "$TAG"

      - name: Create release branch
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          # A MARKER branch, cut after the fact at the release SHA. It does not
          # gate or redirect the release — it gives the version a stable ref to
          # branch a hotfix from. Idempotent, so replaying a dispatch is safe.
          BRANCH="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists — leaving it alone"
          else
            git branch "$BRANCH" HEAD
            git push origin "$BRANCH"
          fi

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_PREFIX }}${{ needs.detect-version.outputs.version }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # bodyFile, never `body:`. The notes carry backticks, em dashes and
          # 4-space indents, and a line reading `EOF` would truncate a
          # GITHUB_OUTPUT heredoc mid-release.
          bodyFile: ${{ steps.notes.outputs.notes_file }}
          # draft: true  # UNCOMMENT only alongside the dispatch block below, when
          #              # a failed deploy must not leave a published release. The
          #              # downstream workflow is then responsible for publishing it.

      # -----------------------------------------------------------------------
      # OPTIONAL — downstream dispatch: deploy, Sentry release, PyPI/npm publish,
      # sourcemap upload. Requires `actions: write` in the permissions block above.
      #
      # This is the seam for anything project-specific. Add steps, don't fork the
      # file — an extra dispatch line here is cheap to review; a second release
      # workflow is how a repo ends up creating two releases for one version.
      #
      # Watch for publish jobs triggered by `on: push: tags:` — those STOP FIRING
      # once this workflow pushes the tag, because a tag pushed with GITHUB_TOKEN
      # does not trigger workflows. Rewire them as a dispatch here.
      # -----------------------------------------------------------------------
      # ☠️ KEEP `--repo`. Without it `gh` falls back to the `GH_REPO` environment
      # variable, and a self-hosted runner may well have one set by the host that
      # registered it — Daniel's writes a BARE repo name, which `gh` refuses:
      # `expected the "[HOST/]OWNER/REPO" format, got "preon-site"`. That failed
      # preon-site's 4.3.0 release on 2026-09-03 AFTER the tag, the marker branch
      # and the release object existed, so the release looked successful while the
      # deploy never fired and the release stayed a draft. A flag outranks the
      # environment variable, which is the whole reason this one line fixes it.
      # - name: Dispatch deploy
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh workflow run deploy-heroku.yml --repo "${{ github.repository }}" --ref main \
      #       -f version="${{ needs.detect-version.outputs.version }}"
